[package]
name = "svarog-eddsa"
version = "0.1.0"
edition = "2024"

[dependencies]
# 公开错误类型: erreur::Resultat (内部跨 anyhow 边界用 AnyhowExt 桥接).
anyhow = { version = "1.0.99", features = ["backtrace"] }
erreur = "0.2"

bip32 = { path = "../common/bip32" }
commons-lang = { path = "../common/commons-lang" }
commons-mpc = { path = "../common/commons-mpc" }
curve-abstract = { path = "../svarog-algebra/curve-abstract" }
hex = "0.4.3"
rand = "0.9.2"
rug = { version = "1.28.1", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde-pickle = "1.2.0"
sha2 = "0.10.9"
svarog-curve25519 = { path = "../svarog-algebra/svarog-curve25519" }
svarog-messenger = { path = "../svarog-messenger" }
vss = { path = "../common/vss" }

[dev-dependencies]
blake2 = "0.10.6"
dashmap = "6"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "time"] }
