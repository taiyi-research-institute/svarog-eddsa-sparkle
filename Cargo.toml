[package]
name = "svarog-eddsa-sparkle"
version = "0.1.0"
edition = "2024"
description = "Sparkle threshold EdDSA with distributed key generation, batch signing, and share rotation."
repository = "https://github.com/taiyi-research-institute/svarog-eddsa-sparkle"
readme = "README.md"
license = "MIT OR Apache-2.0"

[dependencies]
aes-gcm = "0.10"
blake2 = "0.10"
digest = "0.10"
erreur = "0.2"

hex = "0.4"
rand = "0.10"
rug = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde-pickle = "1"
sha2 = "0.11"

curve-abstract = "0.1.0"
svarog-curve25519 = "0.1.0"
svarog-lagrange = "0.1.0"

[dev-dependencies]
dashmap = "6"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "time"] }
