[package]
name = "svarog-eddsa-sparkle"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
blake2 = "0.10"
digest = "0.10"
erreur = "0.2"

hex = "0.4"
rand = "0.10"
rug = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde-pickle = "1"
sha2 = "0.11"

curve-abstract = { git = "https://github.com/taiyi-research-institute/svarog-algebra.git" }
svarog-curve25519 = { git = "https://github.com/taiyi-research-institute/svarog-algebra.git" }
svarog-lagrange = { git = "https://github.com/taiyi-research-institute/svarog-algebra.git" }

[dev-dependencies]
dashmap = "6"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "time"] }
